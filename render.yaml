# ── ENERVERA CBC — Render deployment (two microservices) ──
# Backend pipeline (Layers 2→6) + a separate OCR service (Layer 1, PaddleOCR).
# The backend reaches the OCR service over HTTP via OCR_SERVICE_URL.
#
# Set secret values (NEO4J_PASSWORD, GEMINI_API_KEY, DATABASE_URL, …) in the
# Render dashboard — they are intentionally not committed here.

services:
  # ── OCR microservice (Layer 1) ──────────────────────────────────────────────
  - type: web
    name: enervera-ocr
    runtime: python
    rootDir: ocr
    plan: standard            # PaddleOCR is memory-heavy; bump if the build OOMs
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Backend pipeline (Layers 2→6) ───────────────────────────────────────────
  - type: web
    name: enervera-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Point the backend at the OCR service's public URL. Set this in the
      # dashboard after the OCR service deploys, e.g.
      #   https://enervera-ocr.onrender.com
      - key: OCR_SERVICE_URL
        sync: false
      # Secrets — set these in the Render dashboard (sync:false keeps them off git).
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
