# ── ENERVERA CBC — Render deployment (single service) ──
# One backend runs all six layers. Layer 1 is the OCR.space REST API and the
# database is AWS Aurora PostgreSQL, so there is no separate OCR microservice.
#
# Set secret values (DATABASE_URL, OCR_SPACE_API_KEY, NEO4J_*, GEMINI_API_KEY) in
# the Render dashboard — they are intentionally not committed here.

services:
  # ── Backend pipeline (Layers 1→6) ───────────────────────────────────────────
  - type: web
    name: enervera-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # ── Secrets — set these in the Render dashboard (sync:false keeps them off git).
      # Aurora PostgreSQL connection string (async/sync drivers derived from it).
      - key: DATABASE_URL
        sync: false
      # OCR.space (Layer 1).
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: OCR_SPACE_ENDPOINT
        value: https://api.ocr.space/parse/image
      # Neo4j Aura (Layer 4).
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # Gemini (Layer 6).
      - key: GEMINI_API_KEY
        sync: false
      # Application.
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
